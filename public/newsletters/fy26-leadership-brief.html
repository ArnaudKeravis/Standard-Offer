<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CoDesign & Labs · FY26 Leadership Brief</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1A69FF;--navy:#1E2D8A;--green:#1E9E58;--orange:#E85A0E;
  --purple:#7A4FBF;--pink:#C8427E;--teal:#0E8A8A;--gold:#D4A017;
  --cyan:#5DD4D4;--cream:#F5F1EA;--lab-blue-bg:#E8EFFE;
  --bg:#F2F4FA;--surface:#FFFFFF;--surface2:#EEF1F9;--surface3:#E4E8F4;
  --text:#0F1220;--text2:#3A3F5C;--muted:#7A82AA;
  --border:rgba(0,0,0,0.07);--border2:rgba(0,0,0,0.13);
  --grad-blue:linear-gradient(135deg,#1A69FF 0%,#3D8AFF 100%);
  --grad-orange:linear-gradient(135deg,#E85A0E 0%,#FF8A4D 100%);
  --grad-green:linear-gradient(135deg,#1E9E58 0%,#3DCB7D 100%);
  --grad-purple:linear-gradient(135deg,#7A4FBF 0%,#A37AE0 100%);
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{background:var(--bg);color:var(--text);font-family:'Open Sans',sans-serif;overflow-x:hidden;line-height:1.5;}

/* ── ANIMATIONS ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(28px);}to{opacity:1;transform:translateY(0);}}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
@keyframes slideRight{from{opacity:0;transform:translateX(-20px);}to{opacity:1;transform:translateX(0);}}
@keyframes scaleIn{from{opacity:0;transform:scale(0.92);}to{opacity:1;transform:scale(1);}}
@keyframes shine{0%{background-position:-200% center;}100%{background-position:200% center;}}
@keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.04);}}
@keyframes countUp{from{opacity:0;}to{opacity:1;}}
@keyframes drawLine{from{stroke-dashoffset:1000;}to{stroke-dashoffset:0;}}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.fade-in{opacity:0;animation:fadeUp .8s ease-out forwards;}
.delay-1{animation-delay:.1s;}
.delay-2{animation-delay:.2s;}
.delay-3{animation-delay:.3s;}
.delay-4{animation-delay:.4s;}

/* IntersectionObserver-triggered */
.reveal{opacity:0;transform:translateY(30px);transition:opacity .8s cubic-bezier(.2,.8,.2,1),transform .8s cubic-bezier(.2,.8,.2,1);}
.reveal.in{opacity:1;transform:translateY(0);}
.reveal-stagger>*{opacity:0;transform:translateY(20px);transition:opacity .6s ease-out,transform .6s ease-out;}
.reveal-stagger.in>*{opacity:1;transform:translateY(0);}
.reveal-stagger.in>*:nth-child(1){transition-delay:.05s;}
.reveal-stagger.in>*:nth-child(2){transition-delay:.12s;}
.reveal-stagger.in>*:nth-child(3){transition-delay:.19s;}
.reveal-stagger.in>*:nth-child(4){transition-delay:.26s;}
.reveal-stagger.in>*:nth-child(5){transition-delay:.33s;}
.reveal-stagger.in>*:nth-child(6){transition-delay:.40s;}
.reveal-stagger.in>*:nth-child(7){transition-delay:.47s;}
.reveal-stagger.in>*:nth-child(8){transition-delay:.54s;}
.reveal-stagger.in>*:nth-child(9){transition-delay:.61s;}
.reveal-stagger.in>*:nth-child(10){transition-delay:.68s;}
.reveal-stagger.in>*:nth-child(11){transition-delay:.75s;}
.reveal-stagger.in>*:nth-child(12){transition-delay:.82s;}

/* ── HEADER ── */
header{
  background:linear-gradient(135deg,#1A4FCC 0%,#2666E6 35%,#1A69FF 70%,#0F4FBF 100%);
  color:#fff;
  padding:64px 64px 56px;
  display:grid;grid-template-columns:1fr auto;align-items:end;gap:32px;
  position:relative;overflow:hidden;
  min-height:380px;
}

/* Animated particle layer 1 - small slow dots */
.particles{
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.particles svg{position:absolute;width:100%;height:100%;}
.particle{
  fill:#7EE8E8;
  animation:particleFloat 8s ease-in-out infinite;
  transform-origin:center;
}
.particle.big{fill:#A5F0F0;opacity:.9;}
.particle.tiny{fill:#5DD4D4;opacity:.7;}
.particle.glow{fill:#fff;opacity:.85;}

@keyframes particleFloat{
  0%,100%{transform:translateY(0) translateX(0);opacity:0.4;}
  25%{transform:translateY(-12px) translateX(6px);opacity:0.9;}
  50%{transform:translateY(-6px) translateX(-4px);opacity:0.6;}
  75%{transform:translateY(8px) translateX(8px);opacity:0.8;}
}
@keyframes particleRise{
  0%{transform:translateY(60px);opacity:0;}
  10%{opacity:1;}
  90%{opacity:1;}
  100%{transform:translateY(-80px);opacity:0;}
}

/* Vignette overlay for depth */
header::before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(ellipse at 30% 30%,rgba(255,255,255,0.12) 0%,transparent 50%),radial-gradient(ellipse at 80% 80%,rgba(15,79,191,0.4) 0%,transparent 60%);
  pointer-events:none;
  z-index:1;
}
/* Subtle photo-like soft light from top */
header::after{
  content:'';position:absolute;top:-50%;left:-20%;width:140%;height:80%;
  background:radial-gradient(ellipse,rgba(255,255,255,0.18) 0%,transparent 55%);
  pointer-events:none;
  z-index:1;
}

header > *{position:relative;z-index:3;}
.wm{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.24em;color:rgba(255,255,255,.65);text-transform:uppercase;margin-bottom:14px;}
h1{font-family:'Open Sans',sans-serif;font-size:clamp(36px,5.4vw,72px);line-height:.95;font-weight:300;letter-spacing:-.025em;color:#fff;}
h1 em{font-style:italic;font-weight:600;
  background:linear-gradient(90deg,#A5F0F0 0%,#fff 50%,#A5F0F0 100%);
  background-size:200% auto;
  -webkit-background-clip:text;background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:shine 4s ease-in-out infinite;
}
h1 .yr-big{display:block;font-size:clamp(64px,8.5vw,112px);font-weight:700;color:#fff;line-height:.95;letter-spacing:-.035em;margin-top:6px;text-shadow:0 4px 20px rgba(15,79,191,.35);}
.hright{text-align:right;}
.hbadge{display:inline-block;font-family:'Space Mono',monospace;font-size:11px;background:rgba(255,255,255,0.95);color:var(--blue);padding:6px 16px;letter-spacing:.12em;margin-bottom:10px;border-radius:2px;font-weight:700;}
.h-fy{display:block;font-family:'Space Mono',monospace;font-size:9px;border:1px solid rgba(255,255,255,.4);color:rgba(255,255,255,.85);padding:4px 12px;letter-spacing:.12em;margin-bottom:14px;text-align:center;}
.hsub{font-size:13px;color:rgba(255,255,255,.78);line-height:1.7;max-width:230px;margin-left:auto;}
.scroll-hint{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);color:rgba(255,255,255,.6);font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.2em;animation:float 2.5s ease-in-out infinite;z-index:5;}

/* ── HERO KPI ── */
.hero-kpi{
  background:linear-gradient(180deg,#0F4FBF 0%,#0A2D80 100%);
  color:#fff;padding:40px 64px 48px;
  display:grid;grid-template-columns:repeat(4,1fr);gap:1px;
  border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;overflow:hidden;
}
.hero-kpi::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle 1.5px at 8% 20%,rgba(125,232,232,.4) 100%,transparent),
    radial-gradient(circle 2px at 22% 60%,rgba(125,232,232,.5) 100%,transparent),
    radial-gradient(circle 1px at 38% 30%,rgba(255,255,255,.3) 100%,transparent),
    radial-gradient(circle 2.5px at 58% 70%,rgba(125,232,232,.4) 100%,transparent),
    radial-gradient(circle 1.5px at 75% 25%,rgba(125,232,232,.5) 100%,transparent),
    radial-gradient(circle 1px at 92% 65%,rgba(255,255,255,.4) 100%,transparent),
    radial-gradient(circle 2px at 14% 85%,rgba(125,232,232,.35) 100%,transparent),
    radial-gradient(circle 1.5px at 67% 90%,rgba(255,255,255,.3) 100%,transparent);
}
.hk{padding:32px 28px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden;transition:all .3s;cursor:default;backdrop-filter:blur(2px);}
.hk:hover{background:rgba(255,255,255,.09);transform:translateY(-3px);}
.hk-label{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.55);margin-bottom:14px;}
.hk-num{font-family:'Open Sans',sans-serif;font-size:clamp(32px,3.5vw,52px);font-weight:300;line-height:1;letter-spacing:-.02em;color:#fff;margin-bottom:6px;}
.hk-num .accent{
  background:linear-gradient(135deg,#A5F0F0 0%,#fff 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  font-weight:700;
}
.hk-sub{font-size:11px;color:rgba(255,255,255,.65);line-height:1.5;}

/* ── EXEC SUMMARY ── */
.exec-summary{background:var(--surface);border-bottom:1px solid var(--border);padding:64px;position:relative;}
.exec-summary>*{position:relative;z-index:1;}
.exec-summary.labs-bg{background:var(--cream);}
.es-tag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:16px;}
.es-headline{font-family:'Open Sans',sans-serif;font-size:clamp(26px,3vw,40px);font-weight:300;line-height:1.2;letter-spacing:-.015em;max-width:980px;margin-bottom:28px;}
.es-headline em{font-style:italic;font-weight:600;color:var(--blue);}
.es-body{font-size:15px;color:var(--text2);line-height:1.7;max-width:880px;}
.es-pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;}
.es-pill{background:var(--surface2);padding:22px 24px;border-left:3px solid var(--blue);}
.es-pill:nth-child(2){border-color:var(--orange);}
.es-pill:nth-child(3){border-color:var(--green);}
.es-pill-num{font-family:'Open Sans',sans-serif;font-size:28px;font-weight:700;line-height:1;margin-bottom:6px;}
.es-pill:nth-child(1) .es-pill-num{color:var(--blue);}
.es-pill:nth-child(2) .es-pill-num{color:var(--orange);}
.es-pill:nth-child(3) .es-pill-num{color:var(--green);}
.es-pill-label{font-size:13px;font-weight:600;color:var(--text);margin-bottom:6px;}
.es-pill-desc{font-size:12px;color:var(--muted);line-height:1.5;}

/* ── SECTION ── */
.section{padding:64px;border-bottom:1px solid var(--border);}
.sec-hdr{display:flex;align-items:baseline;gap:18px;margin-bottom:36px;flex-wrap:wrap;}
.stag{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;padding:4px 10px;border:1px solid currentColor;opacity:.55;flex-shrink:0;}
.stitle{font-family:'Open Sans',sans-serif;font-size:30px;font-weight:300;letter-spacing:-.015em;}
.stitle em{font-style:italic;font-weight:600;}
.sbadge{display:inline-flex;align-items:center;gap:5px;font-size:9px;font-family:'Space Mono',monospace;letter-spacing:.13em;text-transform:uppercase;padding:3px 9px;border-radius:20px;font-weight:700;flex-shrink:0;margin-left:auto;}
.sb-labs{background:#EAF2FF;color:var(--blue);}
.sb-cd{background:#E6F7EE;color:var(--green);}
.sb-both{background:#F3EEFF;color:var(--purple);}
.sb-win{background:#FEF0E8;color:var(--orange);}
.sec-intro{font-size:14px;color:var(--text2);line-height:1.65;max-width:780px;margin-bottom:28px;}

/* ── IMPACT GRID ── */
.impact-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:2px;background:var(--border);border:1px solid var(--border);}
.ic{background:var(--surface);padding:30px 22px 24px;text-align:left;position:relative;overflow:hidden;transition:all .25s;cursor:default;}
.ic:hover{background:var(--surface2);transform:translateY(-2px);}
.ic-num{font-family:'Open Sans',sans-serif;font-size:42px;font-weight:300;line-height:1;margin-bottom:6px;letter-spacing:-.02em;}
.ic-label{font-size:11px;color:var(--muted);letter-spacing:.13em;text-transform:uppercase;line-height:1.5;}
.ic-bar{position:absolute;bottom:0;left:0;height:3px;width:100%;}

/* ── COUNTRIES (separate band — not aligned to KPI columns) ── */
.countries-band{
  margin-top:28px;padding:22px 26px;
  background:var(--surface2);border:1px solid var(--border);border-radius:8px;
}
.countries-band-label{
  font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--muted);margin-bottom:14px;font-weight:700;
}
.countries-chips{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
.country-chip{
  display:inline-flex;align-items:center;gap:8px;
  background:var(--surface);border:1px solid var(--border);
  padding:8px 14px;border-radius:999px;
  font-size:13px;font-weight:500;color:var(--text2);
  transition:all .15s;
}
.country-chip:hover{border-color:var(--border2);transform:translateY(-1px);}
.flag{font-size:18px;line-height:1;flex-shrink:0;}
.cname{font-size:13px;font-weight:500;color:var(--text2);}

/* ── COMMERCIAL IMPACT ── */
.ci-section{background:linear-gradient(135deg,#0F1429 0%,#1A2052 100%);color:#fff;padding:64px;border-bottom:1px solid rgba(255,255,255,.05);}
.ci-section .stitle{color:#fff;}
.ci-section .stag{color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.3);}
.ci-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:48px;align-items:center;}
.ci-headline{font-family:'Open Sans',sans-serif;font-size:clamp(28px,3.4vw,46px);font-weight:300;line-height:1.15;letter-spacing:-.02em;margin-bottom:24px;color:#fff;}
.ci-headline em{font-style:italic;font-weight:700;
  background:linear-gradient(135deg,#6EA8FF 0%,#A37AE0 100%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.ci-desc{font-size:15px;color:rgba(255,255,255,.7);line-height:1.7;margin-bottom:28px;max-width:580px;}
.ci-uplift{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin-top:24px;}
.cu{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);padding:18px 22px;border-radius:4px;}
.cu-num{font-family:'Open Sans',sans-serif;font-size:32px;font-weight:700;line-height:1;color:#6EA8FF;margin-bottom:4px;}
.cu-label{font-size:11px;color:rgba(255,255,255,.55);letter-spacing:.06em;text-transform:uppercase;font-weight:500;}
/* Donut */
.donut-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;}
.donut{width:280px;height:280px;position:relative;}
.donut svg{width:100%;height:100%;transform:rotate(-90deg);}
.donut .track{fill:none;stroke:rgba(255,255,255,.06);stroke-width:18;}
.donut .seg-renew{fill:none;stroke:#6EA8FF;stroke-width:18;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1) .3s;}
.donut .seg-bid{fill:none;stroke:#A37AE0;stroke-width:18;stroke-linecap:round;stroke-dasharray:565;stroke-dashoffset:565;transition:stroke-dashoffset 1.6s cubic-bezier(.2,.8,.2,1) .8s;}
.donut.in .seg-renew{stroke-dashoffset:141;}
.donut.in .seg-bid{stroke-dashoffset:424;}
.donut-center{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);text-align:center;}
.donut-num{font-family:'Open Sans',sans-serif;font-size:48px;font-weight:700;color:#fff;line-height:1;}
.donut-label{font-size:11px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.16em;margin-top:4px;}
.donut-legend{display:flex;gap:24px;}
.dl{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.7);}
.dl-dot{width:10px;height:10px;border-radius:2px;}

/* ── CLIENT PROJECTS ── */
.cred-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.cred-card{background:var(--surface);border:1px solid var(--border);border-top:3px solid transparent;padding:22px 22px 18px;transition:all .25s;}
.cred-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(20,24,38,.08);}
.cc-logo{display:flex;align-items:center;gap:11px;margin-bottom:11px;}
.cc-logo img{width:30px;height:30px;object-fit:contain;border-radius:3px;flex-shrink:0;}
.cc-fi{width:30px;height:30px;border-radius:3px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;font-family:'Space Mono',monospace;background:var(--surface3);color:var(--muted);text-transform:uppercase;}
.cc-name{font-size:15px;font-weight:600;line-height:1.2;}
.cc-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.cc-meta{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:10px;}
.cc-pill{font-size:9px;font-family:'Space Mono',monospace;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:10px;border:1px solid transparent;font-weight:600;}
.cc-new{background:#FEF0E8;color:var(--orange);border-color:rgba(232,90,14,.2);}
.cc-maint{background:#E6F7EE;color:var(--green);border-color:rgba(30,158,88,.2);}
.cc-ret{background:#F3EEFF;color:var(--purple);border-color:rgba(122,79,191,.2);}
.cc-region{background:var(--surface2);color:var(--muted);border-color:var(--border);}
.cc-amount{font-family:'Open Sans',sans-serif;font-size:17px;font-weight:700;color:var(--blue);margin-bottom:7px;}
.cc-challenge{font-size:12px;color:var(--text2);line-height:1.55;}
.cc-kw{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px;}
.kw{font-size:10px;background:var(--surface2);color:var(--muted);padding:3px 8px;border-radius:3px;font-weight:500;}

/* ── WINS BANNER ── */
.wins-banner{background:linear-gradient(135deg,#FFF7F2 0%,#FFEDDF 100%);border:1px solid rgba(232,90,14,.18);padding:36px 40px;border-radius:6px;margin-bottom:32px;display:grid;grid-template-columns:auto 1fr;gap:32px;align-items:center;}
.wb-icon{font-size:64px;animation:pulse 3s ease-in-out infinite;}
.wb-content h3{font-family:'Open Sans',sans-serif;font-size:24px;font-weight:300;margin-bottom:6px;}
.wb-content h3 em{font-weight:700;font-style:italic;color:var(--orange);}
.wb-stat{font-size:13px;color:var(--text2);margin-bottom:14px;}
.wb-clients{display:flex;flex-wrap:wrap;gap:8px;}
.wb-client{background:#fff;border:1px solid rgba(232,90,14,.2);padding:8px 14px;border-radius:4px;display:flex;align-items:center;gap:8px;font-weight:600;color:var(--text);font-size:13px;}
.wb-client img{width:18px;height:18px;object-fit:contain;border-radius:2px;}
.wb-client .wfi{width:18px;height:18px;border-radius:2px;display:inline-flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;font-family:'Space Mono',monospace;background:var(--surface3);color:var(--muted);}
.wb-amount{font-size:11px;color:var(--orange);font-weight:700;font-family:'Space Mono',monospace;letter-spacing:.05em;}

/* ── EVENTS ── */
.ev-tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.ev-col{background:var(--surface);border:1px solid var(--border);border-top:3px solid transparent;padding:22px 22px 18px;}
.ev-col.ws{border-top-color:var(--green);}
.ev-col.ev{border-top-color:var(--purple);}
.ev-col.vs{border-top-color:var(--blue);}
.ev-col-tag{font-family:'Space Mono',monospace;font-size:9px;letter-spacing:.18em;text-transform:uppercase;margin-bottom:6px;}
.ws .ev-col-tag{color:var(--green);}
.ev .ev-col-tag{color:var(--purple);}
.vs .ev-col-tag{color:var(--blue);}
.ev-col-num{font-family:'Open Sans',sans-serif;font-size:32px;font-weight:300;line-height:1;margin-bottom:14px;}
.lc-grid{display:flex;flex-wrap:wrap;gap:5px;}
.lc{display:inline-flex;align-items:center;gap:6px;background:var(--surface2);border:1px solid var(--border);padding:6px 10px;font-size:12px;font-weight:500;color:var(--text2);transition:all .15s;cursor:default;border-radius:4px;white-space:nowrap;}
.lc:hover{background:var(--surface3);border-color:var(--border2);transform:translateY(-1px);}
.lc img{width:15px;height:15px;object-fit:contain;border-radius:2px;flex-shrink:0;}
.fi{width:15px;height:15px;border-radius:2px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;font-family:'Space Mono',monospace;background:var(--surface3);color:var(--muted);text-transform:uppercase;}

/* ── INSIGHTS GRID ── */
.insights-band{display:grid;grid-template-columns:repeat(6,1fr);gap:2px;margin-bottom:30px;background:var(--border);border:1px solid var(--border);}
.ins-cell{background:var(--surface);padding:32px 22px 26px;text-align:center;position:relative;overflow:hidden;}

.ins-lbl{font-size:10px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;line-height:1.5;}
.ins-bar{position:absolute;bottom:0;left:0;height:3px;width:100%;}

/* ── WORD CLOUD ── */
.wc-card{background:var(--surface);padding:36px 40px;border:1px solid var(--border);}
.wc-title{font-size:11px;font-family:'Space Mono',monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;}
.wc-wrap{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;justify-content:center;padding:8px 0;line-height:1.4;}
.wt{display:inline-block;font-weight:500;cursor:default;transition:all .2s;line-height:1.3;padding:2px 0;}
.wt:hover{transform:scale(1.08);opacity:1;}

/* ── FEEDBACK SECTION ── */
.fb-section{background:var(--surface);}
.fb-hero{display:grid;grid-template-columns:1.1fr 1.4fr;gap:48px;align-items:center;margin-bottom:42px;}
.fb-score{text-align:center;}
.fb-big-num{
  font-family:'Open Sans',sans-serif;font-size:160px;font-weight:700;line-height:1;
  background:linear-gradient(135deg,var(--green) 0%,#3DCB7D 50%,var(--teal) 100%);

  letter-spacing:-.04em;
}
.fb-big-suffix{font-size:60px;font-weight:300;color:var(--muted);}
.fb-big-label{font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:8px;}
.fb-stats{display:flex;flex-direction:column;gap:14px;}
.fb-row{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--border);}

.fb-row-bar{flex:1;height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;position:relative;}
.fb-row-fill{height:100%;border-radius:4px;width:0;transition:width 1.4s cubic-bezier(.2,.8,.2,1);}
.fb-row.in .fb-row-fill{width:var(--w);}
.fb-row-val{font-family:'Open Sans',sans-serif;font-weight:700;color:var(--text);font-size:15px;min-width:50px;text-align:right;}

/* NPS gauge */
.nps-gauge{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:14px;border:1px solid var(--border);border-radius:6px;overflow:hidden;}
.nps-cell{padding:18px 16px;text-align:center;}
.nps-cell.det{background:#FEF0E8;}
.nps-cell.pas{background:#FEF7E0;}
.nps-cell.pro{background:#E6F7EE;}
.nps-pct{font-family:'Open Sans',sans-serif;font-size:24px;font-weight:700;line-height:1;}
.det .nps-pct{color:var(--orange);}
.pas .nps-pct{color:var(--gold);}
.pro .nps-pct{color:var(--green);}
.nps-name{font-size:10px;font-family:'Space Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:5px;}
.nps-sub{font-size:10px;color:var(--muted);margin-top:3px;}

/* ── TESTIMONIALS ── */
.testimonials{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;}
.t-card{background:var(--surface2);border:1px solid var(--border);padding:24px 26px;position:relative;border-radius:6px;transition:all .3s;}
.t-card::before{content:'"';position:absolute;top:6px;left:18px;font-family:Georgia,serif;font-size:64px;color:var(--blue);opacity:.18;line-height:1;font-weight:700;}
.t-card:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(20,24,38,.06);}
.t-text{font-size:13px;color:var(--text);line-height:1.6;font-style:italic;margin:14px 0 14px;position:relative;z-index:1;}

.t-source{font-size:11px;color:var(--muted);}
.t-rating{margin-left:auto;font-size:11px;color:var(--green);font-weight:700;font-family:'Space Mono',monospace;}

/* ── INNOVATIONS ── */
.inno-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
.ig{background:var(--surface);padding:24px 22px;border:1px solid var(--border);border-top:3px solid transparent;transition:all .25s;}
.ig:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(20,24,38,.06);}
.ig.run{border-top-color:var(--green);}
.ig.dem{border-top-color:var(--blue);}
.ig.pend{border-top-color:var(--muted);}
.ig.coh{border-top-color:var(--orange);}

.dem .iglbl{color:var(--blue);}

.coh .iglbl{color:var(--orange);}

.ii:last-of-type{border-bottom:none;}

/* ── SCALING ── */
.sc-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;}
.scard{background:var(--surface);padding:30px 32px;border:1px solid var(--border);border-radius:4px;}
.scardtitle{font-family:'Open Sans',sans-serif;font-size:20px;margin-bottom:16px;font-weight:600;letter-spacing:-.01em;}
.si{font-size:13px;padding:9px 0;border-bottom:1px solid var(--border);color:var(--text2);display:flex;align-items:flex-start;gap:9px;line-height:1.55;}
.si:last-child{border-bottom:none;}

.smc{background:var(--surface2);padding:12px 14px;border-left:3px solid var(--blue);border-radius:0 4px 4px 0;}

/* ── POST-IT WALL (optional — only if live wall exists) ── */
(function () {
const qaText = document.getElementById('qa-text');
const qaAdd = document.getElementById('qa-add');
const qaColors = document.getElementById('qa-colors');
const postits = document.getElementById('postits');
const qaCount = document.getElementById('qa-count');
if (!qaText || !qaAdd || !qaColors || !postits || !qaCount) return;
let activeColor = 'pi-yellow';

const tagMap = {
  'pi-yellow': 'Q',
  'pi-pink': 'Idea',
  'pi-blue': 'Improve',
  'pi-green': 'Praise',
  'pi-orange': 'Concern',
  'pi-purple': 'Note'
};

qaColors.addEventListener('click', (e) => {
  if (e.target.classList.contains('qa-color')) {
    document.querySelectorAll('.qa-color').forEach(c => c.classList.remove('active'));
    e.target.classList.add('active');
    activeColor = e.target.dataset.c;
  }
});

function addPostit() {
  const text = qaText.value.trim();
  if (!text) return;
  const note = document.createElement('div');
  note.className = 'postit ' + activeColor + ' new';
  note.innerHTML = `
    <button class="postit-delete" title="Remove">✕</button>
    <span class="postit-tag">${tagMap[activeColor]}</span>
    <div>${text.replace(/[<>]/g, '')}</div>
    <div class="postit-author">— Live · ${new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
  `;
  postits.appendChild(note);
  qaText.value = '';
  qaText.focus();
  updateCount();
  setTimeout(() => note.classList.remove('new'), 600);
}

qaAdd.addEventListener('click', addPostit);
qaText.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') addPostit();
});

postits.addEventListener('click', (e) => {
  if (e.target.classList.contains('postit-delete')) {
    const note = e.target.closest('.postit');
    note.style.transition = 'all .3s';
    note.style.opacity = '0';
    note.style.transform = 'scale(.8) rotate(8deg)';
    setTimeout(() => { note.remove(); updateCount(); }, 300);
  }
});

function updateCount() {
  qaCount.textContent = postits.querySelectorAll('.postit').length;
}
})();

/* ── DECK NAVIGATION + FIT-TO-SLIDE ── */
(function () {
  const slides = Array.from(document.querySelectorAll(".slide"));
  const navBtns = Array.from(document.querySelectorAll("[data-nav-item]"));
  const progress = document.getElementById("deck-progress");
  let index = 0;
  let locked = false;

  function isInteractive(t) {
    return !!(t && t.closest && t.closest("a, button, input, textarea, select, label, .qa-board, .postits, [data-deck-nav], .newsletters-back"));
  }

  function activateReveals(slide) {
    slide.querySelectorAll(".reveal, .reveal-stagger, .fade-in, .ana-card, .fb-row, #portfolio-donut").forEach((el) => {
      el.classList.add("in");
      el.style.opacity = "1";
      el.style.transform = "none";
      el.style.animation = "none";
    });
    slide.querySelectorAll(".reveal-stagger > *").forEach((el) => {
      el.style.opacity = "1";
      el.style.transform = "none";
    });
  }

  function fitSlide(slide) {
    const viewport = slide.querySelector(".slide-fit");
    const inner = slide.querySelector(".slide-fit-inner");
    if (!viewport || !inner) return;
    inner.style.transform = "scale(1)";
    inner.style.width = "100%";
    // Force layout at natural size
    void inner.offsetHeight;
    const availW = viewport.clientWidth;
    const availH = viewport.clientHeight;
    if (!availW || !availH) return;
    const contentW = Math.max(inner.scrollWidth, inner.offsetWidth);
    const contentH = Math.max(inner.scrollHeight, inner.offsetHeight);
    const scale = Math.min(1, availW / contentW, availH / contentH);
    inner.style.transformOrigin = "top left";
    // Expand width so scaled result fills the stage width when shrinking
    if (scale < 1) {
      inner.style.width = (100 / scale) + "%";
      // remeasure height after width expand for denser text wrap
      void inner.offsetHeight;
      const contentH2 = Math.max(inner.scrollHeight, inner.offsetHeight);
      const scale2 = Math.min(1, availH / contentH2);
      inner.style.transform = "scale(" + scale2 + ")";
      inner.style.width = (100 / scale2) + "%";
    } else {
      inner.style.transform = "scale(1)";
      inner.style.width = "100%";
    }
  }

  function goTo(n) {
    if (locked) return;
    const next = Math.max(0, Math.min(n, slides.length - 1));
    if (next === index && slides[next].classList.contains("is-active")) {
      activateReveals(slides[next]);
      requestAnimationFrame(() => fitSlide(slides[next]));
      return;
    }
    locked = true;
    slides[index].classList.remove("is-active");
    slides[index].setAttribute("aria-hidden", "true");
    index = next;
    slides[index].classList.add("is-active");
    slides[index].setAttribute("aria-hidden", "false");
    activateReveals(slides[index]);
    navBtns.forEach((btn) => {
      const on = Number(btn.dataset.navItem) === index;
      btn.setAttribute("aria-current", on ? "true" : "false");
    });
    if (progress) progress.textContent = String(index + 1).padStart(2, "0") + " / " + String(slides.length).padStart(2, "0");
    requestAnimationFrame(() => {
      fitSlide(slides[index]);
      requestAnimationFrame(() => fitSlide(slides[index]));
    });
    setTimeout(() => { locked = false; }, 420);
  }

  const goNext = () => goTo(index + 1);
  const goPrev = () => goTo(index - 1);

  document.getElementById("stage-frame").addEventListener("click", (e) => {
    if (isInteractive(e.target)) return;
    goNext();
  });

  window.addEventListener("keydown", (e) => {
    const tag = (e.target && e.target.tagName) || "";
    if (["INPUT", "TEXTAREA", "SELECT"].includes(tag)) return;
    if (["ArrowRight", "ArrowDown", "PageDown"].includes(e.key) || e.key === " ") {
      e.preventDefault(); goNext();
    } else if (["ArrowLeft", "ArrowUp", "PageUp"].includes(e.key)) {
      e.preventDefault(); goPrev();
    } else if (e.key === "Home") { e.preventDefault(); goTo(0); }
    else if (e.key === "End") { e.preventDefault(); goTo(slides.length - 1); }
    else if (e.key.toLowerCase() === "f") {
      e.preventDefault();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    }
  });

  navBtns.forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      goTo(Number(btn.dataset.navItem));
    });
  });

  let sx = 0, sy = 0, dragging = false;
  const stage = document.getElementById("stage-frame");
  stage.addEventListener("pointerdown", (e) => {
    if (isInteractive(e.target)) return;
    dragging = true; sx = e.clientX; sy = e.clientY;
  });
  stage.addEventListener("pointerup", (e) => {
    if (!dragging) return;
    dragging = false;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    if (Math.abs(dx) < 40 && Math.abs(dy) < 40) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      if (dx < 0) goNext(); else goPrev();
    } else {
      if (dy < 0) goNext(); else goPrev();
    }
  });

  let resizeTimer;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => fitSlide(slides[index]), 80);
  });
  document.addEventListener("fullscreenchange", () => {
    setTimeout(() => fitSlide(slides[index]), 80);
  });
  if (document.fonts && document.fonts.ready) {
    document.fonts.ready.then(() => fitSlide(slides[index]));
  }

  goTo(0);
})();

</script>
</body>
</html>
